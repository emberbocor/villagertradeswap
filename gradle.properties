org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# The jars are built against 26.1.2 and support 26.1 to 26.1.2 (the classes the mod uses are checked in the three versions).
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.2]
minecraft_label=26.1-26.1.2
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
# Check 26.1 and 26.1.1 with: ./gradlew :common:compileJava "-Pneo_form_version=26.1-1" (or 26.1.1-1)
neo_form_version=26.1.2-1
neo_version=26.1.2.122
# The lowest NeoForge version the mod declares support for: the first NeoForge build for 26.1 (26.1 and 26.1.1 only
# have beta builds). Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=26.1.0.1-beta"
neo_version_range=[26.1.0.1-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

fabric_loader_version=0.19.5
# Minimum Fabric Loader, the one the minimum Fabric API requires.
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.155.3+26.1.2
# Minimum Fabric API, the first build for the 26.1 release (0.140-0.143 target 26.1 snapshots and crash on the release).
# Verify with: ./gradlew :fabric:compileJava "-Pminecraft_version=26.1" "-Pfabric_api_version=0.144.0+26.1" "-Pfabric_loader_version=0.18.4"
# Build metadata (+26.1) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.144.0
fabric_minecraft_version_range=>=26.1 <=26.1.2

# Forge. Each Minecraft version has its own Forge series: 62 (26.1), 63 (26.1.1), 64 (26.1.2).
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1" "-Pforge_version=62.0.0"
# and 26.1.1 with "-Pforge_minecraft_version=26.1.1" "-Pforge_version=63.0.0".
forge_minecraft_version=26.1.2
forge_version=64.1.5
forge_version_range=[62.0.0,)
forge_loader_version_range=[62,)

# NightConfig is shipped by NeoForge and Forge; the Fabric jar bundles this version.
night_config_version=3.8.0

mod_id=villagertradeswap
mod_name=Villager Trade Swap
mod_license=MIT
mod_version=1.1.0
mod_group_id=io.github.emberbocor.villagertradeswap
